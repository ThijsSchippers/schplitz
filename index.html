        <h1>Schplitz: private expense splitting</h1>
        <p>Split costs with a friend. No account, no server, no cloud. Your data is encrypted with AES-256-GCM and stays on your device.</p>

        <h2>How it works</h2>
        <ol>
          <li><strong>Agree on a question.</strong> Pick a question only the two of you can answer. The answer is the encryption key, and we never see it.</li>
          <li><strong>Add what you spent.</strong> Everything stays on your device until you decide to share it.</li>
          <li><strong>Send a link.</strong> Your expenses are encrypted before they go into the link. The other person opens it with the same answer.</li>
          <li><strong>See who owes what.</strong> Schplitz adds it up across currencies, at the exchange rate of the day you paid. No account needed.</li>
        </ol>

        <h2>Technical specification</h2>
        <ul>
          <li>Cipher: AES-256-GCM</li>
          <li>Key derivation: PBKDF2-SHA256, 200,000 iterations</li>
          <li>Salt: 128-bit random per session</li>
          <li>Storage: localStorage, client-side only</li>
          <li>Network: exchange rates only (frankfurter.app)</li>
          <li>Server: none</li>
          <li>Telemetry: none</li>
          <li>Account required: no</li>
        </ul>

        <p>Open Schplitz: <a href="https://schplitz.com/">schplitz.com</a></p>
      </main>
